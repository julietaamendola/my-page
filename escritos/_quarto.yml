project:
  type: website
  output-dir: ../blog

website:
  title: "El blog"
  site-url: https://julietaamendola.github.io/my-page/blog/
  navbar:
    background: light
    left:
      - text: "← Volver al inicio"
        href: ../
    right:
      - text: "Entradas"
        href: index.qmd
      - text: "El grafo"
        href: grafo.qmd
      - icon: rss
        href: index.xml
  page-footer:
    left: "Julieta Améndola · Tandil, Argentina"
    right: "[julietaamendola.github.io](https://julietaamendola.github.io/my-page/)"

format:
  html:
    theme:
      light: [cosmo, ../estilos/juli.scss]
      dark: [cosmo, ../estilos/juli-dark.scss]
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    toc: true
    toc-title: "En esta página"
    html-math-method: mathjax
    fig-align: center
    code-fold: true
    code-summary: "Ver el código de la figura"

lang: es
